name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python main.py --evaluate --data-dir ci-data --output ci-exports/evaluation.json
      - run: python main.py --shadow examples/v5-shadow-synthetic.json --cutoff 2026-10-14T12:00:00Z --data-dir ci-data --output ci-exports/shadow.json
      - if: runner.os == 'Windows'
        run: python -m scripts.gui_smoke
